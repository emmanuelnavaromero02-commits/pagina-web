AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  One-time access bootstrap for 7 Business Solutions: GitHub OIDC, a restricted
  deployment role, a CloudFormation execution role and a private artifact bucket.

Parameters:
  GitHubOwner:
    Type: String
    Default: emmanuelnavaromero02-commits
    AllowedPattern: ^[A-Za-z0-9_.-]+$
  GitHubRepository:
    Type: String
    Default: pagina-web
    AllowedPattern: ^[A-Za-z0-9_.-]+$
  GitHubBranch:
    Type: String
    Default: agent/puesta-produccion-bilingue
    AllowedPattern: ^[A-Za-z0-9_./-]+$
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ""
    Description: >-
      Existing token.actions.githubusercontent.com provider ARN. Leave empty to
      create the account-wide provider in this stack.
    AllowedPattern: >-
      ^$|^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:oidc-provider/token\.actions\.githubusercontent\.com$

Conditions:
  CreateGitHubOidcProvider: !Equals [!Ref ExistingGitHubOidcProviderArn, ""]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Application
          Value: 7businesssolutions-bootstrap

  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 7bs-artifacts-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: RemoveExpiredArtifacts
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Application
          Value: 7businesssolutions-bootstrap

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub ${ArtifactBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: false

  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 7bs-cloudformation-execution-${AWS::Region}
      Description: Provisions only the AWS services used by the 7BS web and contact stacks.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Provision7bsIamRoles
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManageOnly7bsServiceRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:ListRolePolicies
                  - iam:PutRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:UpdateRoleDescription
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/7bs-*
              - Sid: PassOnly7bsRuntimeRoles
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/7bs-*
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - lambda.amazonaws.com
                      - apigateway.amazonaws.com
              - Sid: CreateApiGatewayServiceLinkedRole
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/ops.apigateway.amazonaws.com/AWSServiceRoleForAPIGateway
                Condition:
                  StringEquals:
                    iam:AWSServiceName: ops.apigateway.amazonaws.com
        - PolicyName: Provision7bsComputeAndApi
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Manage7bsLambda
                Effect: Allow
                Action:
                  - lambda:AddPermission
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:DeleteFunctionConcurrency
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetPolicy
                  - lambda:ListTags
                  - lambda:PutFunctionConcurrency
                  - lambda:RemovePermission
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:7bs-*
              - Sid: ManageRegionalApiGateway
                Effect: Allow
                Action:
                  - apigateway:DELETE
                  - apigateway:GET
                  - apigateway:PATCH
                  - apigateway:POST
                  - apigateway:PUT
                Resource:
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/account
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/domainnames
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/domainnames/api.7businesssolutions.com*
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/restapis*
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/tags/*
              - Sid: ManageContactWebAcl
                Effect: Allow
                Action:
                  - wafv2:AssociateWebACL
                  - wafv2:CreateWebACL
                  - wafv2:DeleteWebACL
                  - wafv2:DisassociateWebACL
                  - wafv2:GetWebACL
                  - wafv2:GetWebACLForResource
                  - wafv2:ListTagsForResource
                  - wafv2:TagResource
                  - wafv2:UntagResource
                  - wafv2:UpdateWebACL
                Resource: "*"
        - PolicyName: Provision7bsObservabilityAndEmail
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Manage7bsLogGroups
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DeleteRetentionPolicy
                  - logs:DescribeLogGroups
                  - logs:ListTagsForResource
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/7bs-*
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/7bs-*
              - Sid: DescribeLogGroupsForReconciliation
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
              - Sid: Manage7bsAlarms
                Effect: Allow
                Action:
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                Resource: !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:7bs-*
              - Sid: Manage7bsSesConfigurationSets
                Effect: Allow
                Action:
                  - ses:CreateConfigurationSet
                  - ses:CreateConfigurationSetEventDestination
                  - ses:DeleteConfigurationSet
                  - ses:DeleteConfigurationSetEventDestination
                  - ses:DescribeConfigurationSet
                  - ses:GetConfigurationSet
                  - ses:ListConfigurationSets
                  - ses:ListTagsForResource
                  - ses:PutConfigurationSetReputationOptions
                  - ses:PutConfigurationSetSendingOptions
                  - ses:PutConfigurationSetSuppressionOptions
                  - ses:TagResource
                  - ses:UntagResource
                  - ses:UpdateConfigurationSetEventDestination
                # SES v1 configuration-set APIs do not support resource-level IAM scoping.
                Resource: "*"
              - Sid: Manage7bsNotificationTopics
                Effect: Allow
                Action:
                  - sns:CreateTopic
                  - sns:DeleteTopic
                  - sns:GetTopicAttributes
                  - sns:ListTagsForResource
                  - sns:SetTopicAttributes
                  - sns:Subscribe
                  - sns:TagResource
                  - sns:UntagResource
                Resource: !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:7bs-*
              - Sid: Reconcile7bsEmailSubscriptions
                Effect: Allow
                Action:
                  - sns:GetSubscriptionAttributes
                  - sns:SetSubscriptionAttributes
                  - sns:Unsubscribe
                # SNS subscription APIs do not support resource-level IAM scoping.
                Resource: "*"
        - PolicyName: Provision7bsEncryption
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CreateTaggedContactKeys
                Effect: Allow
                Action: kms:CreateKey
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestTag/Application: 7businesssolutions-contact
              - Sid: ManageTaggedContactKeys
                Effect: Allow
                Action:
                  - kms:CancelKeyDeletion
                  - kms:DescribeKey
                  - kms:DisableKey
                  - kms:DisableKeyRotation
                  - kms:EnableKey
                  - kms:EnableKeyRotation
                  - kms:GetKeyPolicy
                  - kms:GetKeyRotationStatus
                  - kms:ListResourceTags
                  - kms:PutKeyPolicy
                  - kms:ScheduleKeyDeletion
                  - kms:TagResource
                  - kms:UntagResource
                  - kms:UpdateKeyDescription
                Resource: !Sub arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/Application: 7businesssolutions-contact
              - Sid: Manage7bsContactAliases
                Effect: Allow
                Action:
                  - kms:CreateAlias
                  - kms:DeleteAlias
                  - kms:UpdateAlias
                Resource:
                  - !Sub arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:alias/7bs-contact-*
                  - !Sub arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*
              - Sid: ListAliasesForReconciliation
                Effect: Allow
                Action: kms:ListAliases
                Resource: "*"
        - PolicyName: Provision7bsStaticHosting
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Manage7bsWebBuckets
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:DeleteBucketPolicy
                  - s3:GetBucket*
                  - s3:GetEncryptionConfiguration
                  - s3:GetLifecycleConfiguration
                  - s3:ListBucket
                  - s3:PutBucketOwnershipControls
                  - s3:PutBucketPolicy
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutBucketTagging
                  - s3:PutBucketVersioning
                  - s3:PutEncryptionConfiguration
                  - s3:PutLifecycleConfiguration
                Resource: !Sub arn:${AWS::Partition}:s3:::7bs-web-*
              - Sid: ReadDeploymentArtifacts
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub ${ArtifactBucket.Arn}/*
              - Sid: Manage7bsCloudFrontResources
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:CreateFunction
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:CreateResponseHeadersPolicy
                  - cloudfront:DeleteDistribution
                  - cloudfront:DeleteFunction
                  - cloudfront:DeleteOriginAccessControl
                  - cloudfront:DeleteResponseHeadersPolicy
                  - cloudfront:DescribeFunction
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:GetFunction
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:GetResponseHeadersPolicy
                  - cloudfront:ListTagsForResource
                  - cloudfront:PublishFunction
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:UpdateDistribution
                  - cloudfront:UpdateFunction
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:UpdateResponseHeadersPolicy
                Resource: "*"

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 7bs-github-deploy-${AWS::Region}
      Description: Short-lived GitHub Actions deployment role for the exact repository and branch.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOwner}/${GitHubRepository}:ref:refs/heads/${GitHubBranch}
      Policies:
        - PolicyName: DeployOnly7bsStacks
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CreateOrUpdateWithApprovedExecutionRole
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sevenbs-*/*
                Condition:
                  StringEquals:
                    cloudformation:RoleArn: !GetAtt CloudFormationExecutionRole.Arn
              - Sid: Operate7bsStacks
                Effect: Allow
                Action:
                  - cloudformation:CancelUpdateStack
                  - cloudformation:ContinueUpdateRollback
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplate
                  - cloudformation:ListChangeSets
                  - cloudformation:ListStackResources
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sevenbs-*/*
              - Sid: DeleteWithApprovedExecutionRole
                Effect: Allow
                Action: cloudformation:DeleteStack
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sevenbs-*/*
                Condition:
                  StringEquals:
                    cloudformation:RoleArn: !GetAtt CloudFormationExecutionRole.Arn
              - Sid: ValidateTemplates
                Effect: Allow
                Action:
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ValidateTemplate
                Resource: "*"
              - Sid: PassOnlyCloudFormationExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
        - PolicyName: StoreDeploymentArtifacts
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListArtifactBucket
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                Resource: !GetAtt ArtifactBucket.Arn
              - Sid: ManageArtifactObjects
                Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:ListMultipartUploadParts
                  - s3:PutObject
                Resource: !Sub ${ArtifactBucket.Arn}/*
        - PolicyName: PublishStaticExport
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: List7bsWebBuckets
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                Resource: !Sub arn:${AWS::Partition}:s3:::7bs-web-*
              - Sid: Publish7bsWebObjects
                Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:ListMultipartUploadParts
                  - s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::7bs-web-*/*
              - Sid: InvalidateOnly7bsDistributions
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/Application: 7businesssolutions-web

Outputs:
  GitHubOidcProviderArn:
    Value: !If
      - CreateGitHubOidcProvider
      - !Ref GitHubOidcProvider
      - !Ref ExistingGitHubOidcProviderArn
  GitHubSubject:
    Value: !Sub repo:${GitHubOwner}/${GitHubRepository}:ref:refs/heads/${GitHubBranch}
  GitHubDeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
  CloudFormationExecutionRoleArn:
    Value: !GetAtt CloudFormationExecutionRole.Arn
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
