AWSTemplateFormatVersion: "2010-09-09"
Description: Private S3 and CloudFront hosting for the 7 Business Solutions static export.

Parameters:
  Environment:
    Type: String
    Default: preview
    AllowedValues:
      - preview
      - production
  SiteDomainName:
    Type: String
    Default: preview.7businesssolutions.com
    AllowedPattern: ^[A-Za-z0-9.-]+$
  ApexDomainName:
    Type: String
    Default: ""
    Description: Set only for production (for example, 7businesssolutions.com) to redirect it to SiteDomainName.
  CloudFrontCertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate ARN in us-east-1 covering SiteDomainName and optional ApexDomainName.
  ContactApiOrigin:
    Type: String
    Default: https://api.7businesssolutions.com
    AllowedPattern: ^https://[A-Za-z0-9.-]+$

Conditions:
  HasApexDomain: !Not [!Equals [!Ref ApexDomainName, ""]]
  HasCustomCertificate: !Not [!Equals [!Ref CloudFrontCertificateArn, ""]]
  IsPreview: !Equals [!Ref Environment, preview]
  IsProduction: !Equals [!Ref Environment, production]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 7bs-web-${Environment}-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: RemoveOldVersionsAndIncompleteUploads
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Application
          Value: 7businesssolutions-web
        - Key: Environment
          Value: !Ref Environment

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 7bs-static-${Environment}
        Description: Signed CloudFront access to the private static site bucket.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  RoutingFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub 7bs-static-routing-${Environment}
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect the optional apex hostname and resolve static index.html routes.
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host ? request.headers.host.value : '';
          var apexDomain = '${ApexDomainName}';
          var canonicalDomain = '${SiteDomainName}';

          if (apexDomain && host === apexDomain) {
            var rawQuery = request.rawQueryString();
            var querySuffix = rawQuery === undefined ? '' : '?' + rawQuery;
            return {
              statusCode: 308,
              statusDescription: 'Permanent Redirect',
              headers: {
                location: { value: 'https://' + canonicalDomain + request.uri + querySuffix },
                'cache-control': { value: 'public, max-age=3600' }
              }
            };
          }

          if (request.uri.endsWith('/')) {
            request.uri += 'index.html';
          } else if (!request.uri.includes('.')) {
            request.uri += '/index.html';
          }

          return request;
        }

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub 7bs-security-${Environment}
        Comment: Browser security policy for the static site.
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: camera=(), geolocation=(), microphone=(), payment=(), usb=()
              Override: true
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: !Sub "default-src 'self'; base-uri 'self'; connect-src 'self' ${ContactApiOrigin}; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; upgrade-insecure-requests"
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
            Override: true

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases: !If
          - HasCustomCertificate
          - - !Ref SiteDomainName
            - !If [HasApexDomain, !Ref ApexDomainName, !Ref AWS::NoValue]
          - !Ref AWS::NoValue
        Comment: !Sub 7 Business Solutions ${Environment} static site
        CustomErrorResponses:
          - ErrorCode: 403
            ErrorCachingMinTTL: 60
            ResponseCode: 404
            ResponsePagePath: /404.html
          - ErrorCode: 404
            ErrorCachingMinTTL: 60
            ResponseCode: 404
            ResponsePagePath: /404.html
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RoutingFunction.FunctionARN
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          TargetOriginId: static-site-bucket
          ViewerProtocolPolicy: redirect-to-https
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - DomainName: !GetAtt SiteBucket.RegionalDomainName
            Id: static-site-bucket
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        PriceClass: PriceClass_100
        ViewerCertificate: !If
          - HasCustomCertificate
          - AcmCertificateArn: !Ref CloudFrontCertificateArn
            MinimumProtocolVersion: TLSv1.2_2021
            SslSupportMethod: sni-only
          - CloudFrontDefaultCertificate: true
      Tags:
        - Key: Application
          Value: 7businesssolutions-web
        - Key: Environment
          Value: !Ref Environment

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub ${SiteBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: false

Outputs:
  SiteBucketName:
    Description: Destination used by the static publishing script.
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref SiteDistribution
  DistributionDomainName:
    Value: !GetAtt SiteDistribution.DomainName
  SiteDnsRecordName:
    Value: !Ref SiteDomainName
  SiteDnsRecordType:
    Description: Record type to create for the canonical hostname at the external DNS provider.
    Value: CNAME
  SiteDnsTarget:
    Description: Create a Route 53 alias or provider CNAME pointing SiteDnsRecordName here.
    Value: !GetAtt SiteDistribution.DomainName
  SiteDnsHostedZoneId:
    Description: CloudFront hosted zone ID for a Route 53 alias record.
    Value: Z2FDTNDATAQYW2
  PreviewDnsTarget:
    Condition: IsPreview
    Description: DNS target for preview.7businesssolutions.com.
    Value: !GetAtt SiteDistribution.DomainName
  WwwDnsTarget:
    Condition: IsProduction
    Description: DNS target for www.7businesssolutions.com.
    Value: !GetAtt SiteDistribution.DomainName
  ApexDnsTarget:
    Condition: HasApexDomain
    Description: Point the apex alias to this same distribution; the edge function redirects to SiteDomainName.
    Value: !GetAtt SiteDistribution.DomainName
  SquarespaceApexForwardSource:
    Condition: IsProduction
    Description: Configure this source after all DNS records are complete.
    Value: "@"
  SquarespaceApexForwardDestination:
    Condition: IsProduction
    Description: Permanent canonical destination for the root domain.
    Value: !Sub https://${SiteDomainName}
  SquarespaceApexForwardStatus:
    Condition: IsProduction
    Value: "301 Permanent Redirect"
  SquarespaceApexForwardPathMode:
    Condition: IsProduction
    Value: Maintain paths
