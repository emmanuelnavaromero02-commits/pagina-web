name: CI

on:
  push:
    branches: [main, claude/check-branch-repo-Vx3Qm, agent/puesta-produccion-bilingue]
  pull_request:
    branches: [main, claude/check-branch-repo-Vx3Qm]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Install infrastructure dependencies
        run: npm ci --prefix infra

      - name: Test and build contact API
        run: |
          npm run typecheck --prefix infra
          npm test --prefix infra
          npm run build --prefix infra

      - name: Build (static export)
        env:
          NEXT_PUBLIC_CONTACT_ENDPOINT: ${{ vars.NEXT_PUBLIC_CONTACT_ENDPOINT }}
        run: npm run build

      - name: Validate bilingual export
        run: npm run validate:export

      - name: Upload static export artifact
        uses: actions/upload-artifact@v4
        with:
          name: out
          path: out/
          retention-days: 7
